name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - run: go build ./...
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go test -count=1 ./...

  race:
    name: race (compile-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - run: go test -race -count=1 ./...

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - run: go vet ./...

  fuzz-smoke:
    name: fuzz-smoke (compile-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - run: go test -count=1 ./...

  interop-mit:
    name: interop-mit (iprop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Install MIT krb5 runtime
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            krb5-kdc krb5-admin-server krb5-user krb5-kdc-ldap \
            krb5-kpropd python3-gssapi
      - run: go test -tags integration ./integration/mit -run 'TestHarnessSelfTest|TestGoIPROPReplicaAgainstMITMaster|TestMITKpropdAgainstGoIPROPMaster|TestMITIAKERBInitiatorAgainstGo' -count=1 -v
